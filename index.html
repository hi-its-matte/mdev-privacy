<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Privacy</title>
    <style>
        :root {
            /* Palette monocromatica: Nero, Antracite e Bianco */
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-color: #ffffff;
            --accent-hover: #e4e4e7;
            --border-color: #27272a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            max-width: 450px;
            padding: 2.5rem;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            padding: 14px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Pulsante principale: Bianco su Nero */
        .btn-primary {
            background-color: var(--accent-color);
            color: #000000;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Pulsante secondario: Trasparente con bordo */
        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background-color: #1f1f23;
            border-color: #52525b;
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #52525b;
        }

        /* Icona ricolorata in bianco/grigio */
        .icon-shield {
            margin-bottom: 1.5rem;
            stroke: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <svg class="icon-shield" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    
    <h1>CENTRO PRIVACY</h1>
    <p>Gestione della conformità e protezione dei dati. Seleziona un documento ufficiale per procedere alla revisione.</p>

    <div class="button-group">
        <a href="privacy.html" class="btn btn-primary">
            Informativa Privacy
        </a>
        <a href="terms.html" class="btn btn-outline">
            Termini di Servizio
        </a>
    </div>

    <footer>
        MatteDev Studio • 2026
    </footer>
</div>

</body>
</html>
